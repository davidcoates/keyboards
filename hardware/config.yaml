# Cogent -- 38 keys, split, ortholinear.
#
#     X X X X X        top
#     X X X X X        home
#     X X X X X        bottom
#   P      T T T       hand     P = palm key, T = thumbs
#
# Reversible: this lays out ONE board, from the un-mirrored points.
# Fab it twice and flip one over for the right half.
#
meta:
  engine: 4.1.0

units:
  board_margin: 0
  board_fillet: 3

  thumb_gap: 2
  thumb_offset: 0.5U

  half_gap: 5U
  chamfer: 0.5U

  cap_half: (U - 1) / 2                 # 9mm, half an MX 1u cap
  board_half: cap_half + board_margin   # key centre -> board edge

  mcu_width: 18   # Elite-C, upright: horizontal extent.
  mcu_length: 33  # the PCB, upright: vertical extent

  palm_width: 1.5U
  palm_overhang: palm_width - U
  palm_cap_half: cap_half + palm_overhang / 2
  palm_board_half: palm_cap_half + board_margin

  palm_offset: palm_cap_half
  palm_gap: thumb_gap + 1U - 1

  trrs_gap: 0.9          # MCU bottom to the jack's top edge
  trrs_length: 12.5      # PJ320A body, along the barrel
  trrs_half: 3.05        # PJ320A body, half depth
  trrs_face: 2

  trrs_margin_left: 1.5
  trrs_margin_right: 7
  trrs_cx: board_half + thumb_offset - trrs_half - 1
  trrs_cy: trrs_half

  mcu_cx: mcu_length/2 - cap_half - thumb_offset - 2U
  mcu_cy: (thumb_gap+1)/2

points:
  zones:
    matrix:
      anchor.shift: [80, -100]
      key:
        spread: U
        padding: U
      mirror:
        ref: matrix_inner_bottom
        distance: half_gap
      columns:
        pinky:
          rows:
            hand:
              width: palm_width
              tags: [palm]
              adjust:
                shift: [-palm_offset, -palm_gap]
                rotate: 0
          key: {column_net: P4}
        ring:
          rows:
            hand: {skip: true} # the air beside the palm key
          key: {column_net: P5}
        middle:
          key: {column_net: P6}
        index:
          key: {column_net: P7}
        inner:
          key: {column_net: P8}
      rows:
        hand:
          adjust:
            shift: [thumb_offset, -thumb_gap]
          row_net: P16
        bottom: {row_net: P21}
        home:   {row_net: P20}
        top:    {row_net: P19}

outlines:
  left:
    - what: polygon
      fillet: board_fillet
      points:
        - {ref: matrix_pinky_top,    shift: [-board_half, board_half]}
        - {ref: matrix_inner_top,    shift: [board_half, board_half]}
        - {ref: matrix_inner_hand,   shift: [board_half - thumb_offset, cap_half + thumb_gap + 1 + trrs_length]}
        - {ref: matrix_inner_hand,   shift: [board_half, cap_half + thumb_gap + 1 + trrs_length]}
        - {ref: matrix_inner_hand,   shift: [board_half, -board_half]}
        - {ref: matrix_pinky_hand,   shift: [palm_board_half, palm_gap - board_half - thumb_gap]}
        - {ref: matrix_pinky_hand,   shift: [palm_board_half, -board_half]}
        - {ref: matrix_pinky_hand,   shift: [-palm_board_half, -board_half]}
        - {ref: matrix_pinky_hand,   shift: [-palm_board_half, board_half]}
        - {ref: matrix_pinky_hand,   shift: [palm_offset - board_half, board_half]}
  right:
    - what: polygon
      fillet: board_fillet
      points:
        - {ref: mirror_matrix_pinky_top,    shift: [-board_half, board_half]}
        - {ref: mirror_matrix_inner_top,    shift: [board_half, board_half]}
        - {ref: mirror_matrix_inner_hand,   shift: [board_half - thumb_offset, cap_half + thumb_gap + 1 + trrs_length]}
        - {ref: mirror_matrix_inner_hand,   shift: [board_half, cap_half + thumb_gap + 1 + trrs_length]}
        - {ref: mirror_matrix_inner_hand,   shift: [board_half, -board_half]}
        - {ref: mirror_matrix_pinky_hand,   shift: [palm_board_half, palm_gap - board_half - thumb_gap]}
        - {ref: mirror_matrix_pinky_hand,   shift: [palm_board_half, -board_half]}
        - {ref: mirror_matrix_pinky_hand,   shift: [-palm_board_half, -board_half]}
        - {ref: mirror_matrix_pinky_hand,   shift: [-palm_board_half, board_half]}
        - {ref: mirror_matrix_pinky_hand,   shift: [palm_offset - board_half, board_half]}
pcbs:
  # NOTE: `asym` does NOT restrict a condition-style `where` to one half --
  # ergogen evaluates those against every point, mirrors included (see
  # filter.js). The `-/^mirror_/` name filter is what keeps this to one board.
  # The points zone still mirrors, so the preview and outlines.right keep
  # showing the whole keyboard.
  cogent:
    template: kicad8
    outlines:
      board: {outline: left}
    footprints:
      switches:
        what: ceoloide/switch_mx
        where: [["-palm", "-/^mirror_/"]]
        params:
          reversible: true
          to: "{{column_net}}"
          from: "{{colrow}}"
          include_keycap: true
          hotswap: true
      palm_switch:
        what: ceoloide/switch_mx
        where: [["palm", "-/^mirror_/"]]
        params:
          reversible: true
          to: "{{column_net}}"
          from: "{{colrow}}"
          include_keycap: true
          keycap_width: palm_cap_half * 2
          hotswap: true
      mcu:
        what: ceoloide/mcu_nice_nano
        where:
          ref: matrix_middle_hand
          shift: [mcu_cx, mcu_cy]
          rotate: 90
        params:
          reversible: true
          # Jumpers only on the four rows firmware can't remap (RAW/P1, GND/P0,
          # GND/RST, GND/VCC). Matrix pins get swapped per-half in firmware.
          only_required_jumpers: true
      trrs:
        what: ceoloide/trrs_pj320a
        where:
          ref: matrix_inner_bottom
          shift: [trrs_cx, trrs_cy]
          rotate: 0
        params:
          reversible: true
          symmetric: true   # drops R1, mirrors TP/R2/SL about the centreline
          TP: VCC           # ceoloide's note: VCC on tip, GND on sleeve
          R2: P2            # split data (Pro Micro D2)
          SL: GND
      diodes:
        what: ceoloide/diode_tht_sod123
        where: "-/^mirror_/"
        adjust: {shift: [0, -4.7], rotate: 180}
        params:
          reversible: true
          from: "{{colrow}}"
          to: "{{row_net}}"
